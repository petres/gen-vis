<!doctype html>
<!-- the export page of gen-vis, see docs/export.md: window.genVisExport(options) -->
<html>
<head>
<meta charset="utf-8">
<title>gen-vis export</title>
<style>
/* the styles of gen-vis are in the layer gen-vis, these defaults come after
   it, the stylesheets of the options (not in a layer) override both */
@layer gen-vis, gen-vis-export;
@layer gen-vis-export {
    /* the font is the one of gen-vis (Inter where it is installed, the
       one of the system otherwise), the css of the options sets another */
    html, body { margin: 0; padding: 0; background: transparent; }
}
@page { margin: 0; }
</style>
<script type="module" src="esm/export.js"></script>
</head>
<body></body>
</html>
